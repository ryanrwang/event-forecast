<!DOCTYPE html>
<!-- data-booting: set here, before first paint, so nothing shows until
     the tokens, styles, fonts and the first forecast render are all in.
     app.js removes it (see bootReveal); the inline fallback below removes
     it anyway if a slow script or a hung request holds things up. -->
<html lang="en" data-theme="dark" data-booting>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A weather-style forecast for crowd impact from major live events.">
  <title>Event Forecast</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <!-- Tokens first: they inject the CSS custom properties every rule
       below reads, so they must run before the stylesheets apply.
       The ?v= on the local files is a one-time cache nudge from the day
       .htaccess started sending Cache-Control; it needs no bumping. -->
  <script src="tokens.js?v=20260906"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="anonymous">
  <link rel="stylesheet" href="styles.css?v=20260906">
  <script>
    // Boot fallback: if Leaflet or app.js never arrive, or a request
    // hangs, show the page anyway rather than a blank one. app.js
    // normally clears this long before it fires.
    setTimeout(function () {
      document.documentElement.removeAttribute('data-booting');
    }, 6000);
  </script>
  <noscript><style>html[data-booting] .reveal { opacity: 1; }</style></noscript>
</head>
<body>
  <header class="app-header reveal" style="--reveal-i: 0">
    <div class="app-header__brand">
      <span class="app-header__mark" aria-hidden="true"></span>
      <h1 class="app-header__name">Event Forecast</h1>
    </div>
    <div class="app-header__city" id="city-selector" hidden>
      <!-- Multi-day forecast city selector. Hidden when only one city is configured. -->
    </div>
  </header>

  <main class="app-main" id="app-main">
    <!-- M6: stale-data / zero-event banner. Populated by app.js when
         /api/city.php reports staleness or a zero-event run. Hidden
         (via the hidden attribute) by default. -->
    <div class="status-banner" id="status-banner" role="status" aria-live="polite" hidden></div>

    <h2 class="sr-only">Outlook</h2>

    <!-- Toolbar: the outlook view switch and the view filters share one
         row.

         Outlook switch: 7-day strip or month calendar. Rendered by app.js
         and hidden entirely until the archive has a month in it, so a
         fresh install shows no switch and no empty grid.

         View filters: event-type chips, a "smaller venues" chip (off by
         default), and the verdict-follows-filter switch. They apply to
         everything below (strip, timeline, map, rail). Populated by
         app.js once forecasts load; selection persists in localStorage.
         A hidden event still counts toward the day verdict unless the
         switch is on. On phones the group sits behind the "Filters"
         button;
         on wider screens the button is hidden and the group is always
         open. The note repeats the group's own note when the group is
         collapsed, so the verdict caveat never disappears with it. -->
    <div class="controls reveal" id="controls" style="--reveal-i: 1">
      <div class="outlook-switch" id="outlook-switch" role="group"
           aria-label="Outlook view" hidden></div>
      <button class="chip controls__filters-btn" id="event-filter-summary" type="button"
              aria-expanded="false" aria-controls="event-filter" hidden>Filters</button>
      <div class="event-filter" id="event-filter" role="group" aria-label="Filter events"
           data-collapsed="true" hidden></div>
      <span class="event-filter__note controls__note" id="event-filter-note" hidden></span>
    </div>

    <!-- 7-day outlook: one compact verdict pill per day. Today first.
         Selecting a pill drives the detail panel below. -->
    <section class="forecast-strip reveal" id="forecast-strip" aria-label="7-day outlook"
             style="--reveal-i: 2">
      <div class="placeholder" role="status">
        <span class="placeholder__dot" aria-hidden="true"></span>
        Loading forecast&hellip;
      </div>
    </section>

    <!-- Month outlook: the same day cards in a calendar grid, covering
         the archived past as well as the live window. Populated by
         calendar.js; hidden until the month view is chosen. -->
    <section class="forecast-calendar" id="forecast-calendar"
             aria-label="Month outlook" hidden></section>

    <!-- Selected day, today-first order: plain-English takeaway,
         stations likely packed, when it peaks, the map, then the
         events at the scrubbed time. Scaffolded once by app.js. -->
    <section class="forecast-detail reveal" id="forecast-detail" aria-label="Selected day detail"
             style="--reveal-i: 3">
      <div class="forecast-detail__placeholder">
        <span class="forecast-detail__placeholder-eyebrow">Select a day</span>
        <p class="forecast-detail__placeholder-text">
          Tap a day above to see <em>which stations</em> fill up,
          <em>when</em> it peaks, and <em>where</em> it lands.
        </p>
      </div>
    </section>
  </main>

  <footer class="app-footer reveal" style="--reveal-i: 4">
    <small class="app-footer__attribution" id="ticketmaster-attribution">
      Event discovery powered by Ticketmaster.
    </small>
    <small class="app-footer__attribution" id="map-attribution">
      OpenStreetMap contributors &middot; CARTO basemaps
    </small>
    <small class="app-footer__attribution" id="gtfs-attribution" hidden>
      <!-- Populated per configured city from /api/cities.php gtfs_attributions. -->
    </small>
    <small class="app-footer__disclaimer">
      Modeled estimate, not measured.
    </small>
    <!-- Shared Clearful mark: back to the apps index. Same markup as the
         other apps; the SVG lives at the site root, not in this repo. -->
    <div class="app-footer__home">
      <a href="/apps/" title="Back to Apps" class="rw-back-link">
        <img src="/images/icon-rw.svg" alt="Back to Apps" class="rw-back-logo" width="24" height="24">
      </a>
    </div>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin="anonymous"></script>
  <script src="map.js?v=20260906"></script>
  <script src="timeline.js?v=20260906"></script>
  <script src="calendar.js?v=20260906"></script>
  <script src="app.js?v=20260906"></script>
</body>
</html>
