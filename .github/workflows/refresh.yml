name: Refresh forecast data

# Scheduled data generation for the live site. Runs the Python pipeline
# on GitHub-hosted runners (the Bluehost shared-hosting Python cron was
# never reliably set up) and FTP-pushes only the generated data/ tree to
# Bluehost. The PHP serving layer and frontend deploy separately via
# deploy.yml on push to main.
#
# GitHub cron is fixed UTC. Times below target the owner's Eastern-time
# check-ins; in winter (EST, UTC-5) each fires one hour earlier in local
# time than the EDT labels — acceptable.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'   # ~06:00 ET (05:00 in winter) — before morning
    - cron: '0 15 * * *'   # ~11:00 ET (10:00 in winter) — before noon
    - cron: '0 20 * * *'   # ~16:00 ET (15:00 in winter) — before end of workday
    - cron: '0 1  * * *'   # ~21:00 ET (20:00 in winter) — night

# Needed to commit the compact day archive back to main. The forecast
# data itself is never committed — only history/, which accumulates and
# cannot be regenerated (Ticketmaster only serves upcoming events).
permissions:
  contents: write

# A manual dispatch overlapping a scheduled run would race the FTP
# upload; queue instead of running concurrently.
concurrency:
  group: refresh-forecast-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The checkout has no data/ (gitignored), so the pipeline generates
      # the current rolling window from scratch every run.
      - name: Refresh forecast data
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: python -m pipeline.run --window-days 7

      # Safety gate: refuse to sync if the pipeline exited 0 without
      # actually writing the window (e.g. the BudgetExhausted soft-fail
      # path returns 0 by design). The FTP action does incremental sync
      # WITH deletions, so uploading a near-empty data/ tree would delete
      # the server's good forecast folders. City-config-driven — no
      # hardcoded city ids.
      - name: Verify generated data before upload
        run: |
          python - <<'EOF'
          import datetime, json, pathlib, sys, zoneinfo
          cities = json.loads(pathlib.Path("config/cities.json").read_text(encoding="utf-8-sig"))
          missing = []
          for cid in cities:
              cfg = json.loads(pathlib.Path(f"config/{cid}/city.json").read_text(encoding="utf-8-sig"))
              today = datetime.datetime.now(zoneinfo.ZoneInfo(cfg["timezone"])).date().isoformat()
              if not pathlib.Path(f"data/{cid}/{today}/forecast.json").is_file():
                  missing.append(f"data/{cid}/{today}/forecast.json")
          if missing:
              sys.exit("refusing to upload — missing freshly generated files: " + ", ".join(missing))
          print("verified: today's forecast.json present for all configured cities")
          EOF

      # Upload only the generated data tree. data/cache/ (TM response
      # cache + budget counter) is ephemeral runtime state the PHP layer
      # never reads — don't ship it. This step only runs if the prior
      # steps succeeded (default step behavior), so a failed run never
      # overwrites good data on the server.
      - name: Upload data to Bluehost
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./data/
          server-dir: ./apps/eventforecast/data/
          exclude: |
            **/cache/**

      # The compact archive. Separate from data/ on purpose: data/ is
      # regenerated every run and mirrored with deletions, history/
      # accumulates. Mirroring with deletions is still safe here because
      # the checkout carries every committed month, so the local tree is
      # the complete archive plus this run's upsert — never a subset.
      #
      # This has to be its own FTP step rather than riding deploy.yml:
      # the commit below is made with GITHUB_TOKEN, and pushes made with
      # that token deliberately do not trigger other workflows. Without
      # this step the archive would reach the server only on the next
      # human push.
      # Same class of guard as the data one above, for the same reason:
      # this upload syncs WITH deletions, so an empty or missing
      # history/ would wipe the server's accumulated archive — the one
      # artifact that cannot be regenerated. A checkout always restores
      # every committed month, so an empty tree here means something is
      # wrong; skip rather than mirror the emptiness.
      - name: Verify archive before upload
        id: archive_check
        run: |
          if [ -z "$(find history -name '*.json' -type f 2>/dev/null | head -1)" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::history/ has no month files; skipping archive upload and commit."
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "archive: $(find history -name '*.json' | wc -l) month file(s)"
          fi

      - name: Upload day archive to Bluehost
        if: steps.archive_check.outputs.ok == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./history/
          server-dir: ./apps/eventforecast/history/

      # Commit the archive back to main so it survives the next clean
      # checkout. Each run rewrites today's record, so in practice this
      # commits once a day and is a no-op on the other three runs.
      - name: Commit day archive (if changed)
        if: steps.archive_check.outputs.ok == 'true'
        run: |
          if [ -z "$(git status --porcelain -- history)" ]; then
            echo "Archive unchanged; nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add history
            git commit -m "chore: archive forecast day records"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
